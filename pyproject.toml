[project]
name = "rice-ai"
version = "0.1.0"
description = "AI agent for Linux ricing: aggregate r/unixporn and recommend rice setups"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.scripts]
rice-ai = "rice_ai:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
